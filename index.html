<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deathmatch Zero</title>
    <style>
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: #ff1a1a;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 0, 0, 0.4);
        }
        p {
            color: #888888;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 26, 26, 0.2);
            border-top: 3px solid #ff1a1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto 0 auto;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Deathmatch Zero</h1>
        <p>ПОДКЛЮЧЕНИЕ К СЕРВЕРУ...</p>
        <div class="loader"></div>
    </div>

    <!-- Фоновая музыка для загрузки -->
    <audio autoplay loop>
        <source src="bee8fc0ae6880f2.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
